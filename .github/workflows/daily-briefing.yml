name: "GCP Daily Briefing Agent"

on:
  schedule:
    # Runs at 08:00 UTC every day (approx 1:00 AM PST)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      hours_back:
        description: "Hours to look back for updates (default: 24)"
        required: false
        default: "24"
      dry_run:
        description: "Dry run (do not dispatch Slack/Discord webhooks)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  daily-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Briefing Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          HOURS="${{ github.event.inputs.hours_back || '24' }}"
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          python main.py --hours-back "$HOURS" $EXTRA_FLAGS

      - name: Commit and Push Daily Digest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No new digest changes to commit."
          else
            git commit -m "docs: automated GCP daily briefing for $(date -u +'%Y-%m-%d')"
            git push
          fi
